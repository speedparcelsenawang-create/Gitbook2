<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecipeBook — Modern Documentation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

  <!-- Top Navbar -->
  <header class="topbar">
    <div class="topbar-left">
      <button id="sidebarToggle" class="icon-btn" title="Toggle sidebar">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <nav class="topbar-breadcrumb" id="topbarBreadcrumb" aria-label="Breadcrumb"></nav>
      <div class="mobile-brand" aria-label="RecipeBook">
        <span class="mobile-brand-logo">📘</span>
        <span class="mobile-brand-name">RecipeBook</span>
      </div>
      <div class="brand">
        <span class="brand-logo">📘</span>
        <span class="brand-name">RecipeBook</span>
      </div>
    </div>

    <div class="topbar-right">
      <button id="shareButton" class="icon-btn" title="Share" aria-label="Share">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.27 3.27 0 000-1.39l7.05-4.11A2.99 2.99 0 1015 5c0 .24.03.47.08.7L8.03 9.81A3 3 0 106 15c.74 0 1.42-.27 1.94-.72l7.12 4.16c-.05.22-.08.45-.08.69a3 3 0 103.02-3.05zM6 13a1 1 0 110-2 1 1 0 010 2zm12-9a1 1 0 110 2 1 1 0 010-2zm0 16a1 1 0 110-2 1 1 0 010 2z"/></svg>
      </button>
      <button id="settingsButton" class="icon-btn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.61-.18l-2.39.96a7.1 7.1 0 00-1.63-.94L14.4 2.5a.5.5 0 00-.5-.5h-3.8a.5.5 0 00-.5.5l-.35 2.45c-.57.23-1.1.54-1.63.94l-2.39-.96a.5.5 0 00-.61.18L2.7 8.84a.5.5 0 00.12.64l2.03 1.58c-.04.31-.06.62-.06.94s.02.63.06.94L2.82 14.52a.5.5 0 00-.12.64l1.92 3.32a.5.5 0 00.61.18l2.39-.96c.53.4 1.06.71 1.63.94l.35 2.45a.5.5 0 00.5.5h3.8a.5.5 0 00.5-.5l.35-2.45c.57-.23 1.1-.54 1.63-.94l2.39.96a.5.5 0 00.61-.18l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1112 8a3.5 3.5 0 010 7.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-search">
          <div class="search-box">
            <svg viewBox="0 0 24 24"><path d="M11 4a7 7 0 105.29 12.02l4.35 4.34 1.41-1.41-4.34-4.35A7 7 0 0011 4zm0 2a5 5 0 110 10 5 5 0 010-10z"/></svg>
            <input type="text" id="searchInput" placeholder="Cari dokumen…">
          </div>
        </div>
      </div>

      <div class="sidebar-content">
        <nav id="menuTree" class="menu-tree"></nav>
        <button id="addRootPage" class="add-root-btn edit-only">
          <svg viewBox="0 0 24 24"><path d="M12 4v16m-8-8h16"/></svg>
          Tambah Menu
        </button>
      </div>

      <div class="sidebar-footer edit-only">
        <button id="btnExport" class="footer-link-btn" title="Muat turun sandaran JSON">⬇ JSON</button>
        <button id="btnExportMarkdown" class="footer-link-btn" title="Muat turun halaman aktif sebagai Markdown">⬇ .md</button>
        <button id="btnImport" class="footer-link-btn" title="Pulihkan dari fail JSON">⬆ Import</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </aside>

    <div id="sidebarOverlay" class="sidebar-overlay" aria-label="Tutup sidebar"></div>

    <!-- Main content -->
    <main id="content" class="content">
      <!-- rendered via JS -->
    </main>
  </div>
</div>

<!-- Templates -->
<template id="tpl-tree-item">
  <div class="tree-item">
    <div class="tree-row">
      <button class="toggle-caret"><svg viewBox="0 0 24 24"><path d="M8 5l8 7-8 7z"/></svg></button>
      <span class="tree-label"></span>
      <span class="tree-actions edit-only">
        <button class="mini-btn act-add-child" title="Tambah submenu">+</button>
        <button class="mini-btn act-up" title="Alih ke atas">↑</button>
        <button class="mini-btn act-down" title="Alih ke bawah">↓</button>
        <button class="mini-btn act-duplicate" title="Duplikasi">⧉</button>
        <button class="mini-btn act-rename" title="Namakan semula">✎</button>
        <button class="mini-btn act-delete" title="Padam">🗑</button>
      </span>
    </div>
    <div class="tree-children"></div>
  </div>
</template>

<script type="module" src="/js/app.js"></script>
</body>
</html>
